<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101b2b">
<title>Mythvale: Emerald Ruins</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101b2b;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}#wrap{position:relative;width:100%;height:100%;display:grid;place-items:center;background:radial-gradient(ellipse at center,#233b50,#0b1220)}canvas{display:block;width:100%;height:100%;object-fit:contain;image-rendering:auto}#overlay{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,rgba(7,13,25,.35),rgba(7,13,25,.78));padding:22px;text-align:center}#panel{max-width:540px;width:min(92%,540px);padding:24px 22px 20px;border:1px solid rgba(159,221,237,.38);border-radius:22px;background:linear-gradient(145deg,rgba(23,43,61,.95),rgba(10,21,37,.96));box-shadow:0 20px 70px #0008}#eyebrow{color:#7ee7dd;font-size:12px;letter-spacing:.24em;font-weight:800}h1{font-size:clamp(32px,7vw,58px);line-height:.98;margin:10px 0;color:#f5f2dc;letter-spacing:.03em;text-shadow:0 3px 0 #294458}#sub{color:#c1d2d9;line-height:1.5;margin:14px auto 20px;max-width:390px;font-size:14px}button{font:inherit;border:0;cursor:pointer;touch-action:none}#start{background:linear-gradient(180deg,#a9fff0,#51cdbd);color:#102638;font-weight:900;letter-spacing:.08em;padding:14px 28px;border-radius:12px;box-shadow:0 5px 0 #278f88;min-width:180px}#hint{font-size:11px;color:#8ba7b4;margin-top:16px;letter-spacing:.04em}.hidden{display:none!important}#touch{position:absolute;inset:0;pointer-events:none;display:none}#pad{position:absolute;left:max(16px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));display:flex;gap:10px;pointer-events:auto}#actions{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:12px;pointer-events:auto}.ctl{width:clamp(52px,10vw,72px);height:clamp(52px,10vw,72px);border-radius:50%;border:1px solid #c9fff77a;background:linear-gradient(145deg,#456a7acc,#1d374bd9);color:#effffb;font-weight:900;font-size:24px;box-shadow:inset 0 2px 0 #ffffff25,0 5px 14px #0005;display:grid;place-items:center;user-select:none;-webkit-user-select:none}.ctl:active,.ctl.down{background:linear-gradient(145deg,#8de9d7,#337f83);color:#102735}.ctl.attack{width:clamp(60px,11vw,82px);height:clamp(60px,11vw,82px);background:linear-gradient(145deg,#ffd58a,#b56c46);color:#39251c;border-color:#ffe5b9}.ctl.jump{width:clamp(56px,10.5vw,76px);height:clamp(56px,10.5vw,76px)}#mobileTip{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.1em;color:#d8e7e7aa;text-shadow:0 2px 5px #000;white-space:nowrap;pointer-events:none}@media(pointer:fine){#touch{display:none!important}}
</style></head>
<body><div id="wrap"><canvas id="game" width="960" height="540" aria-label="Mythvale: Emerald Ruins playable game"></canvas><div id="overlay"><div id="panel"><div id="eyebrow">AN ORIGINAL FANTASY ACTION ADVENTURE</div><h1>MYTHVALE<br><span style="font-size:.48em;letter-spacing:.18em;color:#8fe9c5">EMERALD RUINS</span></h1><div id="sub">A forgotten kingdom. A living forest. One blade against the ancient guardians. Cross broken temples, battle wild creatures, and reach the Dusk Warden.</div><button id="start">BEGIN ADVENTURE</button><div id="hint">MOVE: A / D or ◀ ▶ &nbsp; · &nbsp; JUMP: SPACE / ↑ &nbsp; · &nbsp; SWORD: J / X</div></div></div><div id="touch"><div id="mobileTip">EMERALD RUINS</div><div id="pad"><button class="ctl" data-key="left" aria-label="Move left">◀</button><button class="ctl" data-key="right" aria-label="Move right">▶</button></div><div id="actions"><button class="ctl jump" data-key="jump" aria-label="Jump">↑</button><button class="ctl attack" data-key="attack" aria-label="Attack">✦</button></div></div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),touch=document.getElementById('touch');
const scenicBg=new Image();scenicBg.src='sky_castle.png';
const W=960,H=540,LEVEL=4200,SAVE_KEY='mythvale-emerald-save-v1',keys={left:false,right:false,jump:false,attack:false};let started=false,last=0,cam=0,shake=0,particles=[],floaters=[],kills=0,checkpoint=0,won=false,saveToast=0;
const player={x:90,y:350,w:34,h:54,vx:0,vy:0,face:1,on:false,hp:5,maxHp:5,attack:0,attackCd:0,inv:0,run:0,coyote:.0,jumpBuffer:0};
const platforms=[{x:0,y:450,w:690,h:120},{x:760,y:425,w:380,h:145},{x:1210,y:450,w:430,h:120},{x:1710,y:410,w:350,h:160},{x:2130,y:450,w:520,h:120},{x:2730,y:415,w:360,h:155},{x:3160,y:450,w:500,h:120},{x:3720,y:420,w:480,h:150}];
const enemies=[{x:390,y:0,w:42,h:34,hp:2,dir:-1,alive:true,range:[300,550],type:0},{x:900,y:0,w:42,h:34,hp:2,dir:1,alive:true,range:[800,1050],type:0},{x:1370,y:0,w:42,h:34,hp:3,dir:1,alive:true,range:[1260,1550],type:1},{x:1870,y:0,w:42,h:34,hp:2,dir:-1,alive:true,range:[1760,2000],type:0},{x:2350,y:0,w:42,h:34,hp:3,dir:1,alive:true,range:[2200,2540],type:1},{x:2860,y:0,w:42,h:34,hp:2,dir:-1,alive:true,range:[2770,3030],type:0},{x:3380,y:0,w:42,h:34,hp:3,dir:1,alive:true,range:[3220,3580],type:1},{x:3890,y:0,w:48,h:42,hp:7,dir:-1,alive:true,range:[3770,4120],type:2}];
function saveProgress(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({checkpoint,kills,defeated:enemies.map(e=>!e.alive),won}));saveToast=1.6}catch(err){}}
function loadProgress(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(!d)return;checkpoint=Math.max(0,Math.min(LEVEL-300,Number(d.checkpoint)||0));kills=Math.max(0,Number(d.kills)||0);if(Array.isArray(d.defeated))enemies.forEach((e,i)=>{if(d.defeated[i])e.alive=false});const floor=platforms.find(p=>checkpoint+player.w>p.x&&checkpoint<p.x+p.w);player.x=floor?Math.max(floor.x,Math.min(checkpoint,floor.x+floor.w-player.w)):90;player.y=(floor?floor.y:450)-player.h;player.hp=player.maxHp;won=!!d.won}catch(err){localStorage.removeItem(SAVE_KEY)}}
loadProgress();
function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(canvas.clientWidth*d);canvas.height=Math.round(canvas.clientHeight*d);ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0)}new ResizeObserver(resize).observe(canvas);resize();
function start(){started=true;overlay.classList.add('hidden');if(matchMedia('(pointer:coarse)').matches)touch.style.display='block';last=performance.now();requestAnimationFrame(loop)}document.getElementById('start').addEventListener('click',start);
function keyName(e){if(['ArrowLeft','a','A'].includes(e.key))return'left';if(['ArrowRight','d','D'].includes(e.key))return'right';if([' ','ArrowUp','w','W'].includes(e.key))return'jump';if(['j','J','x','X'].includes(e.key))return'attack';return null}window.addEventListener('keydown',e=>{let k=keyName(e);if(k){e.preventDefault();keys[k]=true;if(k==='attack'&&started)attack()}});window.addEventListener('keyup',e=>{let k=keyName(e);if(k)keys[k]=false});document.querySelectorAll('.ctl').forEach(b=>{const k=b.dataset.key;const on=e=>{e.preventDefault();keys[k]=true;b.classList.add('down');if(k==='attack')attack()};const off=e=>{e.preventDefault();keys[k]=false;b.classList.remove('down')};b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,off))});
function attack(){if(player.attackCd<=0){player.attack=.24;player.attackCd=.38;for(let i=0;i<8;i++){let a=(-.95+Math.random()*1.9),r=28+Math.random()*30;particles.push({x:player.x+player.w/2+player.face*30,y:player.y+24,vx:Math.cos(a)*r*player.face,vy:Math.sin(a)*r-12,life:.18+Math.random()*.2,max:.38,size:2+Math.random()*4,color:'#a7fff0'})}}}
function spawn(x,y,color,n=8){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*190,vy:-30-Math.random()*170,life:.35+Math.random()*.45,max:.8,size:2+Math.random()*5,color})}
function floorAt(x,yPrev,yNow){for(const p of platforms){if(x+player.w>p.x&&x<p.x+p.w&&yPrev+player.h<=p.y+4&&yNow+player.h>=p.y)return p}return null}
function update(dt){dt=Math.min(dt,.033);player.attackCd=Math.max(0,player.attackCd-dt);player.attack=Math.max(0,player.attack-dt);player.inv=Math.max(0,player.inv-dt);player.coyote=player.on?.10:Math.max(0,player.coyote-dt);player.jumpBuffer=keys.jump?Math.max(player.jumpBuffer,.12):Math.max(0,player.jumpBuffer-dt);player.run+=Math.abs(player.vx)*dt*.09;
const accel=keys.left?-1:keys.right?1:0;if(accel){player.vx+=accel*1800*dt;player.face=accel}else player.vx*=Math.pow(.0007,dt);player.vx=Math.max(-270,Math.min(270,player.vx));if(player.jumpBuffer>0&&player.coyote>0){player.vy=-610;player.on=false;player.coyote=0;player.jumpBuffer=0;spawn(player.x+player.w/2,player.y+player.h,'#b8d8cf',5)}player.vy=Math.min(850,player.vy+1500*dt);const oldY=player.y;player.x=Math.max(0,Math.min(LEVEL-player.w,player.x+player.vx*dt));player.y+=player.vy*dt;player.on=false;const f=floorAt(player.x,oldY,player.y);if(f){player.y=f.y-player.h;player.vy=0;player.on=true}if(player.y>H+100){player.hp--;player.x=Math.max(checkpoint,player.x-180);player.y=250;player.vy=0;player.inv=1.3;shake=8}
if(player.x>checkpoint+520){const safe=platforms.find(p=>player.x+player.w>p.x&&player.x<p.x+p.w&&player.y+player.h<=p.y+8);if(safe){checkpoint=Math.max(safe.x,Math.min(player.x-80,safe.x+safe.w-player.w));saveProgress()}}
for(const e of enemies){if(!e.alive)continue;e.hitCd=Math.max(0,(e.hitCd||0)-dt);e.flash=Math.max(0,(e.flash||0)-dt);let ground=platforms.find(p=>e.x+e.w>p.x&&e.x<p.x+p.w);if(!ground)continue;e.y=ground.y-e.h;const bossPhase=e.type===2?(e.hp<=2?2:e.hp<=4?1:0):0;const patrolSpeed=e.type===2?[44,72,105][bossPhase]:52;e.x+=e.dir*patrolSpeed*dt;if(e.type===2){e.phase=bossPhase;e.bossClock=(e.bossClock||0)+dt;if(e.bossClock>=(bossPhase===2?1.05:bossPhase===1?1.55:2.1)){e.bossClock=0;if(Math.abs(player.x-e.x)<260){e.dir=player.x<e.x?-1:1;e.x+=e.dir*(bossPhase===2?38:bossPhase===1?25:12);spawn(e.x+e.w/2,e.y+e.h/2,bossPhase===2?'#ff765e':'#ffc66e',bossPhase===2?10:5)}}}if(e.x<e.range[0]||e.x+e.w>e.range[1])e.dir*=-1;if(Math.abs((player.x+player.w/2)-(e.x+e.w/2))<120)e.dir=(player.x<e.x?-1:1);const close=Math.abs(player.x+player.w/2-(e.x+e.w/2))<42&&Math.abs(player.y+player.h-e.y)<42;if(close&&player.inv<=0){player.hp--;player.inv=.9;player.vx=player.x<e.x?-250:250;player.vy=-250;shake=8;spawn(player.x+17,player.y+20,'#ff967f',10)}if(player.attack>0&&e.hitCd<=0&&Math.abs(player.x+player.w/2+player.face*40-(e.x+e.w/2))<e.w/2+32&&Math.abs(player.y+player.h/2-(e.y+e.h/2))<52){e.hp-=1;e.hitCd=.27;e.flash=.12;e.x+=player.face*(e.type===2?12:20);shake=Math.max(shake,3);spawn(e.x+e.w/2,e.y+e.h/2,e.type===2?'#ffc66e':'#8bf2dc',7);if(e.hp<=0){e.alive=false;kills++;saveProgress();spawn(e.x+e.w/2,e.y+e.h/2,e.type===2?'#ffc66e':'#87f4df',24);floaters.push({x:e.x,y:e.y-12,text:e.type===2?'WARDEN DOWN':'+ 1',life:1.1})}}}
for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=340*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);for(const f of floaters){f.y-=24*dt;f.life-=dt}floaters=floaters.filter(f=>f.life>0);cam=Math.max(0,Math.min(LEVEL-W,player.x-W*.38));shake=Math.max(0,shake-28*dt);if(player.hp<=0){player.hp=player.maxHp;player.x=Math.max(0,checkpoint);const safe=platforms.find(p=>player.x+player.w>p.x&&player.x<p.x+p.w);player.y=(safe?safe.y:450)-player.h;player.vx=0;player.vy=0;player.inv=1.5;enemies.forEach(e=>{if(!e.alive&&e.type!==2)e.alive=true});saveProgress()}if(player.x>LEVEL-130&&!enemies[enemies.length-1].alive&&!won){won=true;saveProgress()}saveToast=Math.max(0,saveToast-dt)}
function rr(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function drawSky(){
// Illustrated high-detail castle valley asset is rendered in the actual gameplay scene.
if(scenicBg.complete && scenicBg.naturalWidth){
  const sw=W+180, sh=H+10, drift=(cam*.035)%(sw-W);
  ctx.drawImage(scenicBg,-drift,0,sw,sh);
  ctx.drawImage(scenicBg,sw-drift-2,0,sw,sh);
  // Atmospheric haze blends the artwork into the playable foreground.
  const haze=ctx.createLinearGradient(0,250,0,455);haze.addColorStop(0,'#d7f4ee00');haze.addColorStop(1,'#b7e2c522');ctx.fillStyle=haze;ctx.fillRect(0,250,W,205);
}else{
  let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#72c9ed');g.addColorStop(.52,'#b8e8ee');g.addColorStop(1,'#f5e4ad');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let layer=0;layer<3;layer++){let par=[.10,.19,.32][layer],base=[290,350,407][layer],col=['#8fc9b0','#64ad91','#47876f'][layer];ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,H);for(let x=-100;x<=W+100;x+=45){let world=x+cam*par;let y=base-Math.sin(world*.006+layer*.8)*48-Math.cos(world*.013+layer)*20;ctx.lineTo(x,y)}ctx.lineTo(W,H);ctx.closePath();ctx.fill()}
}
}
function drawGround(){for(const p of platforms){let x=p.x-cam;if(x+p.w<0||x>W)continue;let g=ctx.createLinearGradient(0,p.y,0,H);g.addColorStop(0,'#8b6747');g.addColorStop(.12,'#806044');g.addColorStop(1,'#574538');ctx.fillStyle=g;ctx.fillRect(x,p.y,p.w,H-p.y);
// thick grassy ledge with irregular tufts
ctx.fillStyle='#3f9b54';ctx.fillRect(x,p.y,p.w,12);ctx.fillStyle='#69c85e';ctx.fillRect(x,p.y,p.w,5);ctx.fillStyle='#a0df65';for(let i=5;i<p.w;i+=23){ctx.beginPath();ctx.moveTo(x+i,p.y+5);ctx.lineTo(x+i+4,p.y-3-(i%3));ctx.lineTo(x+i+8,p.y+5);ctx.fill()}
// tiny flowers and glossy moss highlights make the walkable ledge read less like a flat block
for(let i=14;i<p.w;i+=61){ctx.fillStyle=(i%2?'#f4e8a2':'#e8f6d0');ctx.beginPath();ctx.arc(x+i,p.y-1-(i%3),1.8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#4eac61';ctx.fillRect(x+i+5,p.y-2,7,2)}
// layered soil, little stones and roots
for(let i=0;i<p.w;i+=38){let xx=x+i;ctx.fillStyle=i%2?'#9a7650':'#6c513a';ctx.beginPath();ctx.moveTo(xx+3,p.y+23);ctx.lineTo(xx+10,p.y+18);ctx.lineTo(xx+22,p.y+22);ctx.lineTo(xx+18,p.y+29);ctx.closePath();ctx.fill();ctx.fillStyle='#493c32';ctx.fillRect(xx+25,p.y+44,7,3);ctx.strokeStyle='#4d6840';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(xx+4,p.y+10);ctx.lineTo(xx+10,p.y+18);ctx.lineTo(xx+7,p.y+27);ctx.stroke()}
ctx.fillStyle='#d1a16b';ctx.fillRect(x,p.y+12,p.w,2)}}
function drawRuins(){// mossy stone arches and broken towers, painted as background scenery
for(let i=0;i<17;i++){let wx=140+i*270,x=wx-cam*.72;if(x<-110||x>W+110)continue;let h=85+(i*37%105),y=438-h;ctx.fillStyle='#738b78';ctx.fillRect(x,y,35,h);ctx.fillRect(x-8,y-8,51,14);ctx.fillStyle='#a9b89a';ctx.fillRect(x+4,y+8,5,h-12);ctx.fillStyle='#496d60';ctx.fillRect(x+17,y+23,10,h-25);ctx.fillStyle='#8ec27a';ctx.fillRect(x-7,y+10,6,18);ctx.fillRect(x+28,y+38,5,21);ctx.fillStyle='#385b4d';ctx.fillRect(x+12,y+48,13,4);ctx.fillStyle='#e9c36c';ctx.globalAlpha=.5;ctx.fillRect(x+20,y+28,3,8);ctx.globalAlpha=1;ctx.fillStyle='#8caa84';ctx.beginPath();ctx.moveTo(x-12,y-8);ctx.lineTo(x+17,y-29);ctx.lineTo(x+48,y-8);ctx.fill();
// little hanging vines
ctx.strokeStyle='#3e8656';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x+7,y+5);ctx.quadraticCurveTo(x+15,y+21,x+9,y+36);ctx.stroke();ctx.fillStyle='#69b75f';ctx.beginPath();ctx.ellipse(x+9,y+23,5,2,-.5,0,Math.PI*2);ctx.fill()}}
function drawEnemy(e){let x=e.x-cam,y=e.y;if(x<-80||x>W+80)return;ctx.save();ctx.translate(x+e.w/2,y+e.h/2);if(e.dir<0)ctx.scale(-1,1);let bob=Math.sin(performance.now()*.008+e.x)*2;ctx.translate(0,bob);if(e.flash>0)ctx.globalAlpha=.48+Math.sin(performance.now()*.08)*.35;if(e.type===2){if((e.phase||0)>0){ctx.globalAlpha=.18+(e.phase===2?.24:.12);ctx.fillStyle=e.phase===2?'#ff593e':'#ffc66e';ctx.beginPath();ctx.ellipse(0,0,36+(e.phase===2?10:0),34+(e.phase===2?8:0),0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}ctx.fillStyle='#241e32';ctx.beginPath();ctx.moveTo(-24,15);ctx.lineTo(-22,-12);ctx.lineTo(-9,-24);ctx.lineTo(0,-17);ctx.lineTo(11,-25);ctx.lineTo(24,-8);ctx.lineTo(22,16);ctx.closePath();ctx.fill();ctx.fillStyle='#b95738';ctx.fillRect(-16,-4,32,18);ctx.fillStyle='#ffd98a';ctx.fillRect(-13,-9,7,5);ctx.fillRect(7,-9,7,5);ctx.fillStyle='#e5a56e';ctx.fillRect(-28,-28,9,18);ctx.fillRect(19,-28,9,18)}else{let g=ctx.createLinearGradient(0,-20,0,18);g.addColorStop(0,e.type===1?'#ffd77c':'#b5ee7b');g.addColorStop(1,e.type===1?'#b96a47':'#4aaf67');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-e.w/2,12);ctx.quadraticCurveTo(-e.w/2-3,-12,0,-17);ctx.quadraticCurveTo(e.w/2+4,-12,e.w/2,12);ctx.quadraticCurveTo(0,23,-e.w/2,12);ctx.fill();ctx.fillStyle='#182d3a';ctx.fillRect(-10,-4,5,7);ctx.fillRect(5,-4,5,7);ctx.fillStyle='#e8fff0';ctx.fillRect(-9,-3,2,2);ctx.fillRect(6,-3,2,2)}ctx.restore();ctx.globalAlpha=1;if(e.type===2){rr(x-3,y-13,54,5,2,'#263445');rr(x-3,y-13,54*Math.max(0,e.hp/7),5,2,e.hp<=2?'#ff634d':e.hp<=4?'#ffd16f':'#f3a56b')}else if(e.hp< (e.type===1?3:2)){rr(x-1,y-8,e.w+2,3,1,'#1b3037');rr(x-1,y-8,(e.w+2)*Math.max(0,e.hp/(e.type===1?3:2)),3,1,'#f3a56b')}}
function drawPlayer(){let x=player.x-cam,y=player.y;ctx.save();ctx.translate(x+player.w/2,y+player.h/2);if(player.face<0)ctx.scale(-1,1);const inv=player.inv>0&&Math.floor(player.inv*18)%2===0;ctx.globalAlpha=inv?.42:1;let run=Math.sin(player.run*2.6),leg=player.on?run*7:2;
// soft ground shadow
ctx.fillStyle='#24452e55';ctx.beginPath();ctx.ellipse(0,player.h/2+4,24,6,0,0,Math.PI*2);ctx.fill();
// boots and animated legs

// green tunic and leather belt
