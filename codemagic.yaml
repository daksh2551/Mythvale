workflows:
  mythvale-android-test-apk:
    name: Mythvale Android Test APK
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: 22.11.0
      java: 21
    scripts:
      - name: Install JavaScript dependencies
        script: npm install
      - name: Prepare game web assets
        script: npm run build
      - name: Create Android wrapper if missing
        script: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
      - name: Build installable debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
      - android/app/build/outputs/**/*.log
